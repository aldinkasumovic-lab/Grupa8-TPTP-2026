    <section class="kontakt-section">

        <h1>Kontaktirajte nas</h1>

        <form id="kontaktForma">

            <div class="form-group">

                <label>Ime</label>

                <input type="text" id="ime">

                <small class="error"></small>

            </div>

            <div class="form-group">

                <label>Prezime</label>

                <input type="text" id="prezime">

                <small class="error"></small>

            </div>

            <div class="form-group">

                <label>Email</label>

                <input type="text" id="email">

                <small class="error"></small>

            </div>

            <div class="form-group">

                <label>Telefon</label>

                <input type="text" id="telefon">

                <small class="error"></small>

            </div>

            <div class="form-group">

                <label>Tema upita</label>

                <select id="tema">

                    <option value="">Odaberite temu</option>
                    <option>Dostava</option>
                    <option>Plaćanje</option>
                    <option>Proizvodi</option>
                    <option>Povrat robe</option>

                </select>

                <small class="error"></small>

            </div>

            <div class="form-group">

                <label>Poruka</label>

                <textarea id="poruka"></textarea>

                <small class="error"></small>

            </div>

            <div class="form-buttons">

                <button type="submit">Pošalji</button>

                <button type="reset">Reset</button>

            </div>

        </form>

        <p id="uspjesnaPoruka"></p>

    </section>
